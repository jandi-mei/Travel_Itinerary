<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Our China Travel Dashboard"
    >

    <title>China Travel Dashboard</title>


    <!-- =========================================================
         GOOGLE FONTS
         ========================================================= -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =========================================================
         MAIN CSS
         ========================================================= -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- =========================================================
         APP CONTAINER
         ========================================================= -->

    <div class="app">


        <!-- =====================================================
             SIDEBAR
             ===================================================== -->

        <aside class="sidebar">


            <!-- Logo -->

            <div class="logo">

                <div class="logo-icon">
                    🇨🇳
                </div>

                <div class="logo-text">

                    <strong>
                        China Trip
                    </strong>

                    <span>
                        Travel Dashboard
                    </span>

                </div>

            </div>


            <!-- Trip information -->

            <div class="trip-summary">

                <span class="trip-label">
                    OUR ADVENTURE
                </span>

                <h2>
                    China 2027
                </h2>

                <p>
                    Shanghai · Suzhou · Hangzhou
                </p>

            </div>


            <!-- City navigation -->

            <div class="navigation-section">

                <div class="navigation-title">
                    DESTINATIONS
                </div>

                <nav class="city-nav">

                    <!--
                        JAVASCRIPT WILL AUTOMATICALLY
                        GENERATE THE CITY BUTTONS HERE.
                    -->

                </nav>

            </div>


            <!-- Sidebar footer -->

            <div class="sidebar-footer">

                <div class="travel-status">

                    <span class="status-dot"></span>

                    <span>
                        Trip planning
                    </span>

                </div>

            </div>


        </aside>


        <!-- =====================================================
             MAIN CONTENT
             ===================================================== -->

        <main class="main-content">


            <!-- Top bar -->

            <header class="topbar">

                <div class="topbar-left">

                    <span class="eyebrow">
                        OUR CHINA ADVENTURE
                    </span>

                    <h1>
                        China Travel
                        <span>2027</span>
                    </h1>

                </div>


                <div class="topbar-right">

                    <div class="traveler-badge">

                        <span>
                            👩🏻
                        </span>

                        <span>
                            👨🏻
                        </span>

                        <small>
                            2 travelers
                        </small>

                    </div>

                </div>

            </header>


            <!-- =================================================
                 DYNAMIC CITY CONTENT

                 JavaScript will generate everything here:

                 City
                   ↓
                 Location tabs
                   ↓
                 Location information
                   ↓
                 Social media
                   ↓
                 Personal photos
                 ================================================= -->

            <div id="city-content"></div>


        </main>


    </div>


    <!-- =========================================================
         PHOTO LIGHTBOX
         ========================================================= -->

    <div
        id="lightbox"
        class="lightbox"
        aria-hidden="true"
    >

        <button
            id="lightboxClose"
            class="lightbox-close"
            aria-label="Close photo"
        >
            ×
        </button>

        <img
            id="lightboxImage"
            src=""
            alt=""
        >

    </div>


    <!-- =========================================================
         SOCIAL MEDIA EMBED SCRIPTS
         ========================================================= -->

    <!-- Instagram -->

    <script
        async
        src="https://www.instagram.com/embed.js"
    ></script>


    <!-- TikTok -->

    <script
        async
        src="https://www.tiktok.com/embed.js"
    ></script>


    <!-- =========================================================
         OUR JAVASCRIPT

         IMPORTANT:

         travel-data.js MUST load first because app.js
         uses TRAVEL_DATA.
         ========================================================= -->

    <script src="js/travel-data.js"></script>

    <script src="js/app.js"></script>


</body>

</html>
